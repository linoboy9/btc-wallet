<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin HD Wallet Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Usamos bitcoinjs-lib y bip39 estables combinados -->
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/bip39/3.1.0/index.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-orange-400">Bitcoin HD Wallet Generator</h1>
        
        <div class="space-y-4">
            <button onclick="generateHDWallet()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                Generar Nueva Semilla y Wallet
            </button>

            <div class="space-y-3 pt-4 border-t border-gray-700">
                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Frase Semilla (12 Palabras - Respaldar):</label>
                    <textarea id="seedPhrase" rows="2" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-yellow-200 select-all font-mono resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Dirección Bitcoin:</label>
                    <input type="text" id="address" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-orange-300 select-all font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Clave Privada:</label>
                    <input type="text" id="privateKey" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-400 select-all font-mono">
                </div>
            </div>
        </div>

        <div class="mt-6 p-4 bg-yellow-900/30 border border-yellow-700/50 rounded-lg text-xs text-yellow-300">
            <strong>Nota de seguridad:</strong> Anota las 12 palabras en un papel físico. Si las pierdes, perderás el acceso a los fondos.
        </div>
    </div>

    <!-- Scripts de respaldo seguros mediantecdnjs alternativo unificado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-secp256k1/1.1.6/tiny-secp256k1.js"></script>
    <script src="https://unpkg.com/bitcoinjs-lib@6.1.5/dist/bitcoinjs-lib.js"></script>
    <script src="https://unpkg.com/bip39@3.1.0/dist/index.js"></script>
    <script src="https://unpkg.com/bip32@3.1.0/dist/index.js"></script>

    <script>
        function generateHDWallet() {
            try {
                // Verificar que las librerías cargaron bien
                if (typeof bip39 === 'undefined' || typeof bitcoin === 'undefined') {
                    throw new Error("Las librerías criptográficas no terminaron de cargar. Recarga la página.");
                }

                // 1. Generar Mnemónico (12 palabras)
                const mnemonic = bip39.generateMnemonic(128);
                const seed = bip39.mnemonicToSeedSync(mnemonic);

                // 2. Crear nodo maestro
                const root = bip32.BIP32Factory(tinysecp).fromSeed(seed, bitcoin.networks.bitcoin);

                // 3. Derivar ruta BIP84 (Native SegWit)
                const child = root.derivePath("m/84'/0'/0'/0/0");

                // 4. Obtener WIF y Dirección
                const privateKeyWIF = child.toWIF();
                const { address } = bitcoin.payments.p2wpkh({
                    pubkey: child.publicKey,
                    network: bitcoin.networks.bitcoin
                });

                // Rellenar campos
                document.getElementById('seedPhrase').value = mnemonic;
                document.getElementById('address').value = address;
                document.getElementById('privateKey').value = privateKeyWIF;

            } catch (error) {
                console.error("Error detallado:", error);
                alert("Error al generar la wallet: " + error.message);
            }
        }
    </script>
</body>
</html>
