<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Billetera Fría</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;padding:16px;text-align:center}
.box{background:#181818;border-radius:20px;padding:22px;max-width:520px;margin:20px auto}
button{width:100%;padding:18px;background:#f7931a;color:#000;border:0;border-radius:14px;font-size:22px;font-weight:900;cursor:pointer}
.w{background:#262626;display:inline-block;margin:5px;padding:10px;border-radius:10px;width:92px}
.addr{background:#000;padding:14px;border-radius:12px;word-break:break-all;margin-top:14px;font-size:14px}
small{color:#888}
</style>
</head>
<body>
<div class="box">
<h2>🔐 Mi Billetera Fría BTC</h2>
<p><small>Generado en tu navegador, no se envía a nadie</small></p>
<button id="btn">GENERAR BILLETERA</button>
<div id="res" style="display:none;margin-top:18px">
<div id="words"></div>
<div id="addr" class="addr"></div>
<div style="margin-top:12px;color:#f7931a;font-size:13px">⚠️ Anota las 12 palabras en papel. Con modo avión = 100% fría.</div>
</div>
<div id="log" style="margin-top:10px;color:#666;font-size:12px"></div>
</div>

<script type="module">
import * as bip39 from 'https://esm.sh/bip39@3.1.0';
import * as bitcoin from 'https://esm.sh/bitcoinjs-lib@6.1.5?bundle';
import { BIP32Factory } from 'https://esm.sh/bip32@4.0.0?bundle';
import * as ecc from 'https://esm.sh/tiny-secp256k1@2.2.3?bundle';

document.getElementById('log').innerText = 'Librerías cargadas ✓ Lista para generar';

const bip32 = BIP32Factory(ecc);

document.getElementById('btn').onclick = async () => {
 try{
  const mnemonic = bip39.generateMnemonic();
  const seed = await bip39.mnemonicToSeed(mnemonic);
  const root = bip32.fromSeed(seed);
  const child = root.derivePath("m/84'/0'/0'/0/0");
  const { address } = bitcoin.payments.p2wpkh({ pubkey: child.publicKey });
  document.getElementById('words').innerHTML = mnemonic.split(' ').map((w,i)=>`<span class=w>${i+1}. ${w}</span>`).join('');
  document.getElementById('addr').innerText = address;
  document.getElementById('res').style.display='block';
 }catch(e){
  document.getElementById('log').innerText = 'Error: '+e.message;
  alert(e.message);
 }
};
</script>
</body>
</html>
