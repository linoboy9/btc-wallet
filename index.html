<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin HD Wallet Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bip39/3.1.0/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bitcoinjs-lib/6.1.5/bitcoinjs-lib.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tiny-secp256k1/2.2.3/secp256k1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bip32/4.2.0/index.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-orange-400">Bitcoin HD Wallet</h1>
        
        <div class="space-y-4">
            <button onclick="generateWallet()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                Generar Nueva Wallet Real
            </button>

            <div class="space-y-3 pt-4 border-t border-gray-700">
                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Frase Semilla (12 Palabras - Respaldar):</label>
                    <textarea id="seedPhrase" rows="2" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-yellow-200 select-all font-mono resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Dirección Bitcoin (Native SegWit - bc1):</label>
                    <input type="text" id="address" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-orange-300 select-all font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Clave Privada (WIF):</label>
                    <input type="text" id="privateKey" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-400 select-all font-mono">
                </div>
            </div>
        </div>

        <div class="mt-6 p-4 bg-yellow-900/30 border border-yellow-700/50 rounded-lg text-xs text-yellow-300">
            <strong>Seguridad:</strong> Anota estas 12 palabras. Con ellas controlas tus fondos reales en la red de Bitcoin.
        </div>
    </div>

    <script>
        function generateWallet() {
            try {
                // Generar 12 palabras aleatorias reales (BIP39)
                const mnemonic = bip39.generateMnemonic(128);
                const seed = bip39.mnemonicToSeedSync(mnemonic);

                // Crear nodo maestro de criptografía
                const root = bip32.BIP32Factory(ecc).fromSeed(seed, bitcoin.networks.bitcoin);
                
                // Derivar dirección estándar BIP84 (Native SegWit)
                const child = root.derivePath("m/84'/0'/0'/0/0");

                // Obtener datos finales
                const privateKeyWIF = child.toWIF();
                const { address } = bitcoin.payments.p2wpkh({
                    pubkey: child.publicKey,
                    network: bitcoin.networks.bitcoin
                });

                // Mostrar en pantalla
                document.getElementById('seedPhrase').value = mnemonic;
                document.getElementById('address').value = address;
                document.getElementById('privateKey').value = privateKeyWIF;

            } catch (err) {
                console.error(err);
                alert("Error al generar: " + err.message);
            }
        }
    </script>
</body>
</html>
