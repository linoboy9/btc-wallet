<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin HD Wallet (Demo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librerías necesarias -->
    <script src="https://cdn.jsdelivr.net/npm/bip39@3.1.0/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bitcoinjs-lib@6.1.5/src/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/buffer@6.0.3/index.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-xl w-full bg-gray-800 rounded-xl shadow-lg p-6 border border-gray-700">
        <h1 class="text-2xl font-bold text-center mb-6 text-orange-400">Bitcoin HD Wallet</h1>
        
        <div class="space-y-4">
            <button onclick="generateWallet()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
                Generar Nueva Wallet
            </button>

            <div class="space-y-3 pt-4 border-t border-gray-700">
                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Frase Semilla (12 palabras):</label>
                    <textarea id="seedPhrase" rows="2" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-yellow-200 select-all font-mono resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Dirección (Native SegWit - bc1):</label>
                    <input type="text" id="address" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-orange-300 select-all font-mono">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-orange-400 uppercase mb-1">Clave Privada (WIF):</label>
                    <input type="text" id="privateKey" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm text-gray-400 select-all font-mono">
                </div>
            </div>
        </div>

        <div class="mt-6 p-4 bg-red-900/40 border border-red-700/50 rounded-lg text-xs text-red-200">
            <strong>⚠️ ADVERTENCIA IMPORTANTE:</strong><br>
            Esto es solo para aprendizaje / demostración.<br>
            <strong>NUNCA</strong> uses una wallet generada en una página web para dinero real.<br>
            Cualquier persona que vea esta página (o el código) podría robarte los fondos.
        </div>
    </div>

    <script>
        // Esperamos a que las librerías carguen
        window.onload = function() {
            console.log("Librerías cargadas");
        };

        async function generateWallet() {
            try {
                // Generar frase mnemónica de 12 palabras
                const mnemonic = bip39.generateMnemonic(128); // 128 bits = 12 palabras

                // Convertir a seed
                const seed = await bip39.mnemonicToSeed(mnemonic);

                // Crear el root del HD wallet (BIP32)
                const root = bitcoinjs.bip32.fromSeed(seed);

                // Ruta de derivación estándar para Native SegWit: m/84'/0'/0'/0/0
                const path = "m/84'/0'/0'/0/0";
                const child = root.derivePath(path);

                // Generar dirección Native SegWit (bc1...)
                const { address } = bitcoinjs.payments.p2wpkh({
                    pubkey: child.publicKey,
                    network: bitcoinjs.networks.bitcoin
                });

                // Clave privada en formato WIF
                const privateKeyWIF = child.toWIF();

                // Mostrar resultados
                document.getElementById("seedPhrase").value = mnemonic;
                document.getElementById("address").value = address;
                document.getElementById("privateKey").value = privateKeyWIF;

            } catch (error) {
                console.error("Error generando wallet:", error);
                alert("Error al generar la wallet. Revisa la consola (F12).");
            }
        }
    </script>
</body>
</html>
