<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTC Fria</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bip39/3.0.4/bip39.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bitcoinjs-lib@5.2.0/dist/bitcoinjs-lib.min.js"></script>
<style>body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:20px}.card{background:#1c1c1c;padding:20px;border-radius:16px;max-width:520px;margin:auto}button{padding:16px;width:100%;background:#f7931a;border:0;border-radius:12px;font-weight:800;font-size:20px} .w{display:inline-block;background:#2c2c2c;margin:5px;padding:8px 12px;border-radius:8px;width:90px} .a{word-break:break-all;background:#000;padding:12px;border-radius:10px;margin-top:12px}</style>
</head>
<body>
<div class="card">
<h2>Generador Billetera Fría</h2>
<button onclick="gen()">GENERAR AHORA</button>
<div id="r" style="display:none;margin-top:20px">
<div id="words"></div>
<div id="addr" class="a"></div>
<div id="wif" class="a" style="color:#888;font-size:11px"></div>
<p style="color:#f7931a;font-size:13px;margin-top:15px">Anota en papel. Con internet apagado = 100% fría.</p>
</div>
</div>
<script>

  if(typeof bip39 === 'undefined' || typeof bitcoin === 'undefined'){
    alert('Aún cargando... espera 5 segundos y vuelve a dar al botón. Necesitas internet solo esta vez.');
    return;
  }
  const mn = bip39.generateMnemonic();
  const seed = bip39.mnemonicToSeedSync(mn);
